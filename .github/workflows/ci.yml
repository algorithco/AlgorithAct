name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: git diff --exit-code -- public/content tests/fixtures/project.v1.json
        name: Verify generated content is current
      - run: npm audit --audit-level=high

  windows-desktop:
    name: Windows desktop
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chrome
      - run: npm run prepare:ffmpeg -- --download
      - run: npm run package:win
      - name: Browser, native, packaged and golden tests
        shell: pwsh
        run: |
          $env:ANIM_FFMPEG_PATH = (Resolve-Path 'resources/ffmpeg/win32-x64/ffmpeg.exe').Path
          $env:ANIM_FFPROBE_PATH = (Resolve-Path 'resources/ffmpeg/win32-x64/ffprobe.exe').Path
          $env:ANIM_PACKAGED_APP = (Resolve-Path 'release/AlgorithAct-win32-x64/AlgorithAct.exe').Path
          npm run test:e2e -- --workers=1
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: |
            test-results/
            playwright-report/
            .qa/golden-diffs/
