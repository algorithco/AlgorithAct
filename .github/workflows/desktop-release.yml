name: Desktop release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/desktop-release.yml'
      - 'tools/**'
      - 'resources/ffmpeg/**'
      - 'src/app-electron/**'
      - 'tests/e2e/**'
      - '*config*'
      - 'package*.json'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  desktop:
    name: Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win32-x64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: macos-15, target: darwin-arm64 }
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify release version and native architecture
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          node -e "if(process.platform+'-'+process.arch!==process.env.EXPECTED_TARGET)throw Error('Runner architecture mismatch');const v=JSON.parse(require('fs').readFileSync('package.json')).version;if(process.env.GITHUB_REF_TYPE==='tag'&&process.env.GITHUB_REF_NAME!=='v'+v)throw Error('Tag/version mismatch')"
      - run: npm run check
      - name: Linux compiler and desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm pkg-config cmake xvfb openbox libgtk-3-0 libnss3 libgbm1 libasound2t64
      - name: macOS compiler dependencies
        if: runner.os == 'macOS'
        run: brew install nasm pkgconf
      - name: Windows compiler dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            make diffutils mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkgconf mingw-w64-x86_64-nasm
      - name: Cache verified FFmpeg sources
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .qa/ffmpeg-sources
          key: ffmpeg-sources-${{ hashFiles('resources/ffmpeg/sources.json') }}
      - name: Restore verified native media runtime
        id: media-runtime
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/ffmpeg/${{ matrix.target }}
          key: native-media-${{ matrix.target }}-${{ hashFiles('resources/ffmpeg/sources.json', 'tools/build-ffmpeg.mjs', 'tools/compile-ffmpeg.sh') }}
      - name: Compile native FFmpeg (Windows)
        if: runner.os == 'Windows' && steps.media-runtime.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: node tools/build-ffmpeg.mjs
      - name: Compile native FFmpeg (macOS/Linux)
        if: runner.os != 'Windows' && steps.media-runtime.outputs.cache-hit != 'true'
        run: npm run build:ffmpeg
      - name: Save verified native media runtime
        if: steps.media-runtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: resources/ffmpeg/${{ matrix.target }}
          key: native-media-${{ matrix.target }}-${{ hashFiles('resources/ffmpeg/sources.json', 'tools/build-ffmpeg.mjs', 'tools/compile-ffmpeg.sh') }}
      - run: npm run package:desktop
      - run: node tools/desktop-test-environment.mjs
      - name: Native and packaged desktop tests
        if: runner.os != 'Linux'
        run: npm run test:e2e:desktop -- --workers=1
      - name: Native and packaged desktop tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args='-screen 0 1920x1080x24' sh -c 'openbox > /tmp/algorithact-openbox.log 2>&1 & npm run test:e2e:desktop -- --workers=1'
      - run: node tools/build-installers.mjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Preserve matching FFmpeg and codec sources
        if: matrix.target == 'linux-x64'
        run: node tools/build-ffmpeg.mjs --sources-only
      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          retention-days: 14
          if-no-files-found: error
          path: |
            release/installer/*.exe
            release/installer/*.dmg
            release/installer/*.zip
            release/installer/*.AppImage
            release/installer/*.tar.gz
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-diagnostics-${{ matrix.target }}
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            test-results/
            .qa/ffmpeg-build/**/ffbuild/config.log
            .qa/ffmpeg-build/**/config.log

  publish:
    name: Publish verified desktop release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a reviewed main-branch commit
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release/assets
      - name: Validate all five platforms and create checksums
        run: node tools/verify-release.mjs
      - name: Publish first alpha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "AlgorithAct ${GITHUB_REF_NAME#v} — First desktop alpha" --notes-file docs/releases/0.1.0.md
          gh release upload "$GITHUB_REF_NAME" release/assets/*
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
